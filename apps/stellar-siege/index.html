<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stellar Siege</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/ui.css">
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="hud" class="hidden">
    <div id="hud-left">
      <span id="hud-color" class="hud-color-dot"></span>
      <span id="hud-energy">⚡ 0</span>
      <span id="hud-nodes">● 0 nodes</span>
    </div>
    <div id="hud-center">
      <div id="speed-controls">
        <button class="speed-btn" data-speed="0.5">½×</button>
        <button class="speed-btn active" data-speed="1">1×</button>
        <button class="speed-btn" data-speed="2">2×</button>
        <button class="speed-btn" id="pause-btn">⏸</button>
      </div>
      <span id="hud-timer">0:00</span>
    </div>
    <div id="hud-right">
      <span id="hud-fps"></span>
      <button id="sound-toggle" class="speed-btn" aria-label="Toggle game sound" aria-pressed="true">Sound on</button>
      <button id="hud-menu" class="speed-btn">Menu</button>
    </div>
  </div>
  <div id="hud-players" class="hidden">
  </div>

  <div id="upgrade-panel" class="hidden">
    <div class="upgrade-title">Upgrade Node</div>
    <button class="upgrade-btn" data-upgrade="overcharge">
      <span class="upgrade-icon">⚡</span>
      <span class="upgrade-name">Overcharge</span>
      <span class="upgrade-desc">+50% production, -20% defense</span>
    </button>
    <button class="upgrade-btn" data-upgrade="shield">
      <span class="upgrade-icon">🛡</span>
      <span class="upgrade-name">Shield Matrix</span>
      <span class="upgrade-desc">+50% defense, -20% production</span>
    </button>
    <button class="upgrade-btn" data-upgrade="cannon">
      <span class="upgrade-icon">🚀</span>
      <span class="upgrade-name">Pulse Cannon</span>
      <span class="upgrade-desc">Auto-attack nearby enemy streams</span>
    </button>
    <div class="upgrade-cost">Cost: <span id="upgrade-cost-value">0</span> energy</div>
  </div>

  <div id="menu-screen">
    <h1 class="menu-title">STELLAR SIEGE</h1>
    <div class="menu-subtitle">Conquer the stars</div>
    <div class="menu-options">
      <div class="menu-option">
        <label>Opponents</label>
        <select id="menu-opponents">
          <option value="1">1 AI</option>
          <option value="2">2 AI</option>
          <option value="3">3 AI</option>
        </select>
      </div>
      <div class="menu-option">
        <label>Difficulty</label>
        <select id="menu-difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>
      <div class="menu-option">
        <label>Map Size</label>
        <select id="menu-mapsize">
          <option value="small">Small (20 nodes)</option>
          <option value="medium" selected>Medium (35 nodes)</option>
          <option value="large">Large (50 nodes)</option>
        </select>
      </div>
    </div>
    <button id="menu-start" class="menu-btn">SOLO GAME</button>
    <button id="menu-multiplayer" class="menu-btn secondary">MULTIPLAYER</button>
  </div>

  <!-- Multiplayer Menu -->
  <div id="mp-menu" class="hidden">
    <h1 class="menu-title">MULTIPLAYER</h1>
    <div class="menu-subtitle">Play with friends</div>
    <button id="mp-create" class="menu-btn">CREATE GAME</button>
    <button id="mp-join" class="menu-btn secondary">JOIN GAME</button>
    <button id="mp-back" class="menu-btn secondary">← BACK</button>
  </div>

  <!-- Create Lobby -->
  <div id="mp-create-screen" class="hidden">
    <h1 class="menu-title">CREATE GAME</h1>
    <div class="menu-options">
      <div class="menu-option">
        <label>Your Name</label>
        <input type="text" id="mp-create-name" class="menu-input" maxlength="16" placeholder="Enter name" autocomplete="off" spellcheck="false">
      </div>
      <div class="menu-option">
        <label>Map Size</label>
        <select id="mp-mapsize">
          <option value="small">Small</option>
          <option value="medium" selected>Medium</option>
          <option value="large">Large</option>
        </select>
      </div>
    </div>
    <div class="lobby-slots" id="mp-slots">
      <div class="lobby-slot host">
        <span class="slot-label">Slot 1 (You)</span>
        <span class="slot-type">Host</span>
      </div>
      <div class="lobby-slot">
        <span class="slot-label">Slot 2</span>
        <select class="slot-select" data-slot="1">
          <option value="open">Open (Human)</option>
          <option value="ai-easy">AI (Easy)</option>
          <option value="ai-medium" selected>AI (Medium)</option>
          <option value="ai-hard">AI (Hard)</option>
          <option value="closed">Closed</option>
        </select>
      </div>
      <div class="lobby-slot">
        <span class="slot-label">Slot 3</span>
        <select class="slot-select" data-slot="2">
          <option value="open">Open (Human)</option>
          <option value="ai-easy">AI (Easy)</option>
          <option value="ai-medium">AI (Medium)</option>
          <option value="ai-hard">AI (Hard)</option>
          <option value="closed" selected>Closed</option>
        </select>
      </div>
      <div class="lobby-slot">
        <span class="slot-label">Slot 4</span>
        <select class="slot-select" data-slot="3">
          <option value="open">Open (Human)</option>
          <option value="ai-easy">AI (Easy)</option>
          <option value="ai-medium">AI (Medium)</option>
          <option value="ai-hard">AI (Hard)</option>
          <option value="closed" selected>Closed</option>
        </select>
      </div>
    </div>
    <button id="mp-create-go" class="menu-btn">CREATE LOBBY</button>
    <button id="mp-create-back" class="menu-btn secondary">← BACK</button>
  </div>

  <!-- Active Lobby -->
  <div id="mp-lobby" class="hidden">
    <h1 class="menu-title">LOBBY</h1>
    <div class="invite-code-box">
      <span class="invite-label">INVITE CODE</span>
      <span class="invite-code" id="mp-code">------</span>
      <button class="copy-btn" id="mp-copy-code">📋 Copy</button>
    </div>
    <div id="mp-lobby-slots" class="lobby-slots">
      <!-- dynamically filled -->
    </div>
    <div id="mp-lobby-actions">
      <button id="mp-start" class="menu-btn">START GAME</button>
      <button id="mp-lobby-leave" class="menu-btn secondary">LEAVE</button>
    </div>
  </div>

  <!-- Join Screen -->
  <div id="mp-join-screen" class="hidden">
    <h1 class="menu-title">JOIN GAME</h1>
    <div class="join-input-group">
      <input type="text" id="mp-join-name" class="join-input name-input" maxlength="16" placeholder="YOUR NAME" autocomplete="off" spellcheck="false">
      <input type="text" id="mp-join-code" class="join-input" maxlength="6" placeholder="INVITE CODE" autocomplete="off" spellcheck="false">
    </div>
    <button id="mp-join-go" class="menu-btn">JOIN</button>
    <button id="mp-join-back" class="menu-btn secondary">← BACK</button>
  </div>

  <div id="game-over-screen" class="hidden">
    <h1 id="game-over-title"></h1>
    <div id="game-over-stats"></div>
    <button id="game-over-restart" class="menu-btn">PLAY AGAIN</button>
    <button id="game-over-menu" class="menu-btn secondary">MAIN MENU</button>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
